allowBuilds:
  cbor-extract: true
  esbuild: true
minimumReleaseAgeExclude:
  - moldecor@2.0.0-rc.3
overrides:
  # Keep every `vite` specifier in the graph on the Vite+ core alias so Vitest
  # and the rest of the toolchain share one Vite instance.
  vite@*: "npm:@voidzero-dev/vite-plus-core@0.3.3"
packages:
  - ui
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
  ignoreMissing:
    # pglite-socket lists these extensions as peers but they are unused here;
    # without this pnpm 12 would auto-install all seven into the staged binary.
    - "@electric-sql/pglite-pgvector"
    - "@electric-sql/pglite-age"
    - "@electric-sql/pglite-pg_hashids"
    - "@electric-sql/pglite-pg_ivm"
    - "@electric-sql/pglite-pg_textsearch"
    - "@electric-sql/pglite-pg_uuidv7"
    - "@electric-sql/pglite-pgtap"
